global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  metric_name_validation_scheme: utf8
  scrape_native_histograms: false
  extra_scrape_metrics: false

scrape_configs:
- job_name: 'prometheus'
  metrics_path: /metrics
  static_configs:
  - targets:
    - localhost:9090

- job_name: 'oci-backend'
  metrics_path: /metrics
  static_configs:
  - targets:
    - backend:8000

- job_name: 'redis_exporter'
  static_configs:
    - targets:
      - exporter:9121

