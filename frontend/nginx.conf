# Rate limiting zones per client IP (in http context when included)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum client body size
    client_max_body_size 2M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # Protect internal Prometheus metrics from public exposure on portfolio domain
    location /metrics {
        # Restricted: In Kubernetes, Prometheus scrapes backend:8000 directly.
        # Reject external public traffic.
        deny all;
        return 404;
    }

    # Protect internal Kubernetes probes from public exposure on portfolio domain
    location ~ ^/(livez|readyz|startupz|healthz) {
        # Restricted: In Kubernetes, Kubelet probes backend:8000 directly.
        deny all;
        return 404;
    }

    # Stricter rate limit for authentication endpoint
    location /api/v1/auth/login {
        limit_req zone=auth_limit burst=2 nodelay;
        limit_conn conn_limit 5;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API endpoints with rate limiting & anti-flooding
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_conn conn_limit 15;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for nginx pod itself
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }
}
